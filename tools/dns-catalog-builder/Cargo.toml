[package]
name = "dns-catalog-builder"
version = "0.21.0"
edition = "2024"
rust-version = "1.99.1"

[dependencies]
clap = { version = "4.6", default-features = false, features = ["derive", "std", "color", "help", "usage", "error-context", "suggestions"] }
csv = "1.4"
dns-pcap-generator = { path = "../dns-pcap-generator" }
thiserror = { version = "2.0", default-features = false, features = ["std"] }
