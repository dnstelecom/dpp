[package]
name = "dns-pcap-generator"
version = "0.21.0"
edition = "2024"
rust-version = "1.99.1"

[dependencies]
clap = { version = "4.6", default-features = false, features = ["derive", "std", "color", "help", "usage", "error-context", "suggestions"] }
pcap-file = "3.0.0-rc1"
seahash = "4.1.0"
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
sha2 = { version = "0.11.1", default-features = false }
thiserror = { version = "2.0", default-features = false, features = ["std"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
